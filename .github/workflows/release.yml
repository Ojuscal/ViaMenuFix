name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0，留空则用 0.0.0-dev）'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 写入签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，将使用一次性随机密钥（无法覆盖安装旧版本）"
          else
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/viamenufix.jks
          fi

      - name: 解析版本号
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.version || '0.0.0-dev' }}" >> "$GITHUB_OUTPUT"
            echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: bash build.sh

      - name: 生成校验和
        run: sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ViaMenuFix-${{ steps.ver.outputs.name }}
          path: out/*.apk

      - name: 发布 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          generate_release_notes: true
